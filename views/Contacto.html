      <div id="map"></div>
    
      <!-- Leaflet y la librería de rutas -->
      <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
      <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>
    
      <script>
        // Coordenadas de tu negocio (Rue du Rhône 25, 1204 Genève, Suiza)
        const negocioLatLng = [46.2023, 6.1469];
    
        // Inicializar el mapa centrado en tu negocio
        const map = L.map('map').setView(negocioLatLng, 13);
    
        // Cargar OpenStreetMap como capa base
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
    
        // Agregar un marcador para el negocio
        L.marker(negocioLatLng).addTo(map)
          .bindPopup('¡Aquí está nuestro negocio! Rue du Rhône 25, 1204 Genève, Suiza')
          .openPopup();
    
        // Intentar obtener la ubicación del usuario
        map.locate({ setView: true, maxZoom: 16 });
    
        // Cuando se obtiene la ubicación del usuario
        map.on('locationfound', function(e) {
          const userLatLng = e.latlng; // Coordenadas del usuario
    
          // Agregar marcador para la ubicación del usuario
          L.marker(userLatLng).addTo(map)
            .bindPopup('Tu ubicación')
            .openPopup();
    
          // Calcular la ruta entre el negocio y el usuario
          L.Routing.control({
            waypoints: [
              L.latLng(userLatLng.lat, userLatLng.lng),  // Lugar del usuario
              L.latLng(negocioLatLng[0], negocioLatLng[1]) // Lugar del negocio
            ],
            routeWhileDragging: true  // Permite arrastrar la ruta si se desea
          }).addTo(map);
        });
    
        // Si falla la geolocalización, mostrar un mensaje
        map.on('locationerror', function(e) {
          alert("No pudimos obtener tu ubicación 😞");
        });
      </script>
